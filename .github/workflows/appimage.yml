name: Build AppImage

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    # 24.04: the oldest Ubuntu with WebKitGTK 6.0, which Red Star Online (built into the AppImage) needs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the whole history and its tags: tools/version.sh counts from the last release

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Tools for AppImage creation and delta updates, and Red Star Online's libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y zsync libfuse2t64 meson ninja-build pkg-config libgtk-4-dev libwebkitgtk-6.0-dev \
            libjson-glib-dev libsoup-3.0-dev libgstreamer1.0-dev

      - name: Build AppImage
        env:
          GH_REPO: ${{ github.repository }}
        run: ./build-appimage.sh x64

      - uses: actions/upload-artifact@v5
        with:
          name: RedStarOS-x86_64
          path: |
            dist/RedStarOS-x86_64.AppImage
            dist/RedStarOS-x86_64.AppImage.zsync

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RedStarOS-x86_64.AppImage
            dist/RedStarOS-x86_64.AppImage.zsync
