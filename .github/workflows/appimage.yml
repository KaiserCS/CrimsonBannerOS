name: Build AppImage

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    # 24.04: the oldest Ubuntu with WebKitGTK 6.0, which Crimson Online (built into the AppImage) needs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the whole history and its tags: tools/version.sh counts from the last release

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Tools for AppImage creation and delta updates, and Crimson Online's libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y zsync libfuse2t64 meson ninja-build pkg-config libgtk-4-dev libwebkitgtk-6.0-dev \
            libjson-glib-dev libsoup-3.0-dev libgstreamer1.0-dev

      - name: Build AppImage
        env:
          GH_REPO: ${{ github.repository }}
        run: ./build-appimage.sh x64

      - uses: actions/upload-artifact@v5
        with:
          name: RedStarOS-x86_64
          path: |
            dist/RedStarOS-x86_64.AppImage
            dist/RedStarOS-x86_64.AppImage.zsync

      - name: Release notes from CHANGELOG.md (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v="${GITHUB_REF_NAME#v}"
          # the tag's section: from its heading to the next release's
          awk -v v="$v" '$0 ~ "^## "v" " {on=1; next} on && /^## / {exit} on' CHANGELOG.md > dist/notes.md
          printf '\n---\nAppImage: download it, make it executable and run it. On Arch, CachyOS or EndeavourOS: `./install-arch.sh` from the source.\n' >> dist/notes.md
          cat dist/notes.md
          echo "RELEASE_NAME=Crimson Banner OS $v" >> "$GITHUB_ENV"

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          body_path: dist/notes.md
          files: |
            dist/RedStarOS-x86_64.AppImage
            dist/RedStarOS-x86_64.AppImage.zsync
            software/catalog.json
