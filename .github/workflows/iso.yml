# SPDX-License-Identifier: GPL-3.0-or-later
# Crimson Banner OS's installer ISOs (tools/iso.sh, iso/), each started in QEMU to check the live session comes up.
# The Linux ISO is built on every change; the libre and Mac ones (and the two kernels Arch doesn't ship) are put
# aside for now and only built when asked for by hand ("libre_and_mac"). On a v* tag they are attached to its release; run by
# hand with "publish", they go to the "iso-testing" pre-release. Everything here is also tools/iso.sh on any Arch
# machine: CI only repeats it.
name: Installer ISOs

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['iso/**', 'greeter/**', 'crimson-gtk/**', 'tools/iso.sh', '.github/workflows/iso.yml', '.github/scripts/iso-*.sh', 'packaging/**', 'RedStarOS/**', 'compositor/**']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the ISOs to the "iso-testing" pre-release
        type: boolean
        default: false
      libre_and_mac:
        description: Also the libre and Mac ISOs (put aside for now; they build their own kernels, an hour or two each)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: Kernel ${{ matrix.kernel }}
    strategy:
      fail-fast: false
      matrix:
        kernel: [linux-libre, linux-t2]
    if: ${{ inputs.libre_and_mac }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      # a kernel is rebuilt only when its recipe changes
      - uses: actions/cache@v4
        id: cache
        with:
          path: iso-repo
          key: kernel-${{ matrix.kernel }}-${{ hashFiles(format('iso/pkgs/{0}/**', matrix.kernel)) }}
      - name: Room on the disk
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / /mnt
      - name: Build ${{ matrix.kernel }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: .github/scripts/iso-docker.sh recipe ${{ matrix.kernel }}
      - run: ls -l iso-repo

  iso-linux:
    name: ISO (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: linux, kernel: linux }
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tools/version.sh counts from the last release
      - name: Room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / /mnt
      - name: The libre kernel, from the cache
        if: matrix.variant == 'libre'
        uses: actions/cache/restore@v4
        with:
          path: iso-repo
          key: kernel-linux-libre-${{ hashFiles('iso/pkgs/linux-libre/**') }}
          fail-on-cache-miss: true
      - name: The Mac kernel, from the cache
        if: matrix.variant == 'mac'
        uses: actions/cache/restore@v4
        with:
          path: iso-repo
          key: kernel-linux-t2-${{ hashFiles('iso/pkgs/linux-t2/**') }}
          fail-on-cache-miss: true
      - name: Build the ISO
        run: .github/scripts/iso-docker.sh iso ${{ matrix.variant }}
      - name: What takes the room (GitHub takes files up to 2 GiB)
        run: .github/scripts/iso-size.sh "$(ls out/*.iso)"
      - name: Start it in QEMU (live session, Wayland session, login screen; through its own BIOS and UEFI boot menus)
        # the live session, the Wayland session and the login screen, on plain and on VMware graphics (no 3D)
        run: .github/scripts/iso-boot-test.sh "$(ls out/*.iso)" ${{ matrix.kernel }} x11:std x11:vmware wayland:vmware greeter:vmware wayland:virtio greeter:virtio x11:std:bios x11:std:uefi
      - name: Install it onto an empty disk, check what was installed, and start it
        # the installer driven from the keyboard (crimson.test=install), then the installed disk's login screen and a session
        run: .github/scripts/iso-install-test.sh "$(ls out/*.iso)" ${{ matrix.kernel }}
      - name: Install it onto btrfs, check GRUB can read the kernel, and start it
        # the installer's other file system for a whole disk: GRUB reads the kernel from btrfs itself
        run: .github/scripts/iso-install-test.sh "$(ls out/*.iso)" ${{ matrix.kernel }} btrfs
      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${{ inputs.publish }}" = true ]; then
            tag=iso-testing
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --prerelease --title "Installer ISOs (testing)" \
              --notes "Test builds of the installer ISOs from main. Not a release."
          fi
          # an ISO over GitHub's 2 GiB per file goes up in parts, with merge-iso.sh and merge-iso.ps1 to join them
          files=()
          for iso in out/*.iso; do
            tools/split-iso.sh "$iso" > "$RUNNER_TEMP/upload.txt"
            mapfile -t -O "${#files[@]}" files < "$RUNNER_TEMP/upload.txt"
          done
          if ls out/*.part01 >/dev/null 2>&1; then
            notes="$(gh release view "$tag" --json body -q .body || true)"
            grep -q "merge-iso" <<<"$notes" || gh release edit "$tag" --notes "$notes

          **An ISO here is in parts** (GitHub takes files up to 2 GiB). Download every \`.partNN\`, its \`.parts.sha256\` and \`.sha256\`, and the merge script into one folder, then run \`sh merge-iso.sh\` (Linux, macOS) or \`merge-iso.ps1\` (Windows: right-click, Run with PowerShell). It checks each part, joins them and checks the ISO." \
              || echo "::warning::couldn't add the note on joining the parts to the release"
          fi
          gh release upload "$tag" "${files[@]}" out/*.iso.sha256 --clobber

  iso:
    name: ISO (${{ matrix.variant }})
    needs: kernel
    if: ${{ !cancelled() && inputs.libre_and_mac }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: libre, kernel: linux-libre }
          - { variant: mac, kernel: linux-t2 }
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tools/version.sh counts from the last release
      - name: Room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / /mnt
      - name: The libre kernel, from the cache
        if: matrix.variant == 'libre'
        uses: actions/cache/restore@v4
        with:
          path: iso-repo
          key: kernel-linux-libre-${{ hashFiles('iso/pkgs/linux-libre/**') }}
          fail-on-cache-miss: true
      - name: The Mac kernel, from the cache
        if: matrix.variant == 'mac'
        uses: actions/cache/restore@v4
        with:
          path: iso-repo
          key: kernel-linux-t2-${{ hashFiles('iso/pkgs/linux-t2/**') }}
          fail-on-cache-miss: true
      - name: Build the ISO
        run: .github/scripts/iso-docker.sh iso ${{ matrix.variant }}
      - name: What takes the room (GitHub takes files up to 2 GiB)
        run: .github/scripts/iso-size.sh "$(ls out/*.iso)"
      - name: Start it in QEMU (live session, Wayland session, login screen; through its own BIOS and UEFI boot menus)
        # the live session, the Wayland session and the login screen, on plain and on VMware graphics (no 3D)
        run: .github/scripts/iso-boot-test.sh "$(ls out/*.iso)" ${{ matrix.kernel }} x11:std x11:vmware wayland:vmware greeter:vmware wayland:virtio greeter:virtio x11:std:bios x11:std:uefi
      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${{ inputs.publish }}" = true ]; then
            tag=iso-testing
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --prerelease --title "Installer ISOs (testing)" \
              --notes "Test builds of the installer ISOs from main. Not a release."
          fi
          # an ISO over GitHub's 2 GiB per file goes up in parts, with merge-iso.sh and merge-iso.ps1 to join them
          files=()
          for iso in out/*.iso; do
            tools/split-iso.sh "$iso" > "$RUNNER_TEMP/upload.txt"
            mapfile -t -O "${#files[@]}" files < "$RUNNER_TEMP/upload.txt"
          done
          if ls out/*.part01 >/dev/null 2>&1; then
            notes="$(gh release view "$tag" --json body -q .body || true)"
            grep -q "merge-iso" <<<"$notes" || gh release edit "$tag" --notes "$notes

          **An ISO here is in parts** (GitHub takes files up to 2 GiB). Download every \`.partNN\`, its \`.parts.sha256\` and \`.sha256\`, and the merge script into one folder, then run \`sh merge-iso.sh\` (Linux, macOS) or \`merge-iso.ps1\` (Windows: right-click, Run with PowerShell). It checks each part, joins them and checks the ISO." \
              || echo "::warning::couldn't add the note on joining the parts to the release"
          fi
          gh release upload "$tag" "${files[@]}" out/*.iso.sha256 --clobber
