name: Check

# Every push and pull request gets a green or red mark. These jobs run side by side:
#   • app            build + every C# test (every window opens, Files, archives, batch rename, terminal, …) and a
#                    screenshot of every window (artifact "screenshots": open index.html)
#   • window-manager redstar-wm on a virtual screen: its behaviour tests, click delivery, and a real GTK program
#                    session (artifact "session-screenshots")
#   • compositor     redstar-comp (wlroots 0.20, in an Arch Linux container) built with warnings as errors, then its
#                    behaviour tests on wlroots' virtual screen through Xwayland
#   • packages       Crimson Banner's own package feed (tools/packages.sh): filled once, then the shell is restored, built
#                    and published with nuget.org cut off
#   • browser        Crimson Online (GTK 4 + WebKitGTK, in an Arch Linux container): unit tests and the real
#                    browser's self-test, headless inside redstar-comp
#   • login          crimson-login, the login screen in Vala and GTK 4, and crimson-gtk, the GTK theme it shares (in
#                    an Arch Linux container): their tests, and the login screen and the theme's gallery drawn
#                    headless inside redstar-comp (printed in the log)
#   • arch-packages  ./install-arch.sh with nuget.org cut off: the Arch packages (packaging/arch) built from our own
#                    feed, signed into our own pacman repository (tools/repo.sh) and installed from it with pacman
# The same checks run locally with ./check.sh.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  app:
    name: Build and C# tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Libraries for drawing windows and the tools some features use
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1 fonts-dejavu-core fonts-noto-core \
            libx11-dev gcc tar xz-utils zstd p7zip-full shared-mime-info libvlc5 vlc-plugin-base \
            dbus libglib2.0-bin

      - name: ISOs split for GitHub and joined again (tools/split-iso.sh, merge-iso.sh, merge-iso.ps1 in PowerShell)
        run: tools/test-split-iso.sh
      - name: PRINCIPLES.md matches its tables (tools/test-principles.sh)
        run: tools/test-principles.sh
      - name: The Crimson Banner icon theme is whole (tools/test-icon-theme.sh)
        run: tools/test-icon-theme.sh
      - name: Build
        run: dotnet build RedStarOS/RedStarOS.csproj -c Release
      - name: Build Planner (apps/planner)
        run: dotnet build apps/planner/src/CrimsonPlanner.csproj -c Release
      - name: Build People's Archive (apps/archive)
        run: dotnet build apps/archive/src/PeoplesArchive.csproj -c Release
      - name: Build Atlas (apps/atlas)
        run: dotnet build apps/atlas/src/CrimsonAtlas.csproj -c Release

      - name: C# tests (with a screenshot of every window)
        env:
          REDSTAR_SCREENSHOTS: ${{ github.workspace }}/screenshots
        run: >
          dotnet test tests/RedStarOS.Tests/RedStarOS.Tests.csproj -c Release
          --logger "console;verbosity=normal" --logger "trx;LogFilePrefix=results"
          --results-directory TestResults

      - name: Our apps' pages and the shell's parts, printed (base64 PNG between "---- screen.png (NAME) ----" lines)
        if: always()
        run: |
          for f in screenshots/Planner-*.png screenshots/Archive-*.png screenshots/Atlas-*.png screenshots/Shell-*.png screenshots/SettingsWindow.png screenshots/FileManagerWindow.png screenshots/GemsWindow.png screenshots/RichWriterWindow.png screenshots/SpreadsheetWindow.png screenshots/SlidesWindow.png screenshots/StudioWindow.png screenshots/CalculatorWindow.png screenshots/ClockWindow.png screenshots/CalendarWindow.png screenshots/CameraWindow.png screenshots/VoiceMemosWindow.png screenshots/ScreenshotWindow.png screenshots/ScreenRecorderWindow.png screenshots/DisksWindow.png screenshots/NotesWindow.png; do
            [ -f "$f" ] || continue
            echo "---- screen.png ($(basename "$f" .png)) ----"; base64 -w0 "$f"; echo; echo "---- end screen.png ----"
          done

      - name: Summary
        if: always()
        run: |
          python3 .github/scripts/summary.py tests TestResults >> "$GITHUB_STEP_SUMMARY" || true
          python3 .github/scripts/summary.py shots screenshots >> "$GITHUB_STEP_SUMMARY" || true

      - name: Every window again, in the light theme
        env:
          REDSTAR_SCREENSHOTS: ${{ github.workspace }}/screenshots-light
          REDSTAR_SCREENSHOT_THEME: Light
        run: dotnet test tests/RedStarOS.Tests/RedStarOS.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~ScreenshotTests"

      - name: Every window, dark and light, as contact sheets in the log (for when the artifact can't be fetched)
        if: always()
        run: |
          sudo apt-get -qq install -y python3-pil >/dev/null 2>&1 || true
          python3 .github/scripts/contact-sheet.py screenshots dark
          python3 .github/scripts/contact-sheet.py screenshots-light light
          for f in screenshots/Software-*.png; do
            [ -f "$f" ] || continue
            echo "---- $(basename "$f") ----"; base64 -w0 "$f"; echo; echo "---- end ----"
          done

      - uses: actions/upload-artifact@v5
        # the account's artifact storage can fill up; that mustn't fail a check whose tests passed
        continue-on-error: true
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
          retention-days: 3

      - uses: actions/upload-artifact@v5
        # the account's artifact storage can fill up; that mustn't fail a check whose tests passed
        continue-on-error: true
        if: failure()
        with:
          name: test-results
          path: TestResults
          retention-days: 3

  window-manager:
    name: Window manager (Xvfb)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: X11 build tools and a virtual screen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libx11-dev libxtst-dev libxi-dev xvfb x11-utils imagemagick \
            python3-gi gir1.2-gtk-3.0

      - name: redstar-wm compiles without warnings
        run: gcc -O2 -Wall -Wextra -Werror -o /tmp/redstar-wm wm/redstar-wm.c -lX11 -ldl -lm

      - name: Behaviour and click tests
        run: wm/test/run-tests.sh

      - name: Real session with a GTK program
        env:
          SESSION_SHOTS: ${{ github.workspace }}/session-screenshots
        run: /usr/bin/python3 wm/test/session_test.py

      - uses: actions/upload-artifact@v5
        # the account's artifact storage can fill up; that mustn't fail a check whose tests passed
        continue-on-error: true
        if: always()
        with:
          name: session-screenshots
          path: session-screenshots
          if-no-files-found: ignore
          retention-days: 3

  packages:
    name: Own package feed (offline build)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Fill the feed (the only step that uses the network)
        run: tools/packages.sh fill

      - name: The lock files in the repository are the ones restored
        run: |
          if git ls-files --error-unmatch RedStarOS/packages.lock.json >/dev/null 2>&1; then
            git diff --exit-code -- '*packages.lock.json'
          else
            echo "::warning::packages.lock.json isn't in the repository yet: commit the files from the lock-files artifact"
            for f in RedStarOS/packages.lock.json tests/RedStarOS.Tests/packages.lock.json; do
              echo "LOCKFILE $f $(gzip -9c "$f" | base64 -w0)"
            done
          fi

      - uses: actions/upload-artifact@v5
        # the account's artifact storage can fill up; that mustn't fail a check whose tests passed
        continue-on-error: true
        with:
          name: lock-files
          path: |
            RedStarOS/packages.lock.json
            tests/RedStarOS.Tests/packages.lock.json
          retention-days: 3

      - name: Cut off nuget.org and empty every package cache
        run: |
          rm -rf ~/.nuget/packages ~/.local/share/NuGet
          echo "0.0.0.0 api.nuget.org www.nuget.org nuget.org globalcdn.nuget.org" | sudo tee -a /etc/hosts
          if curl -fsS -m 10 https://api.nuget.org/v3/index.json >/dev/null 2>&1; then echo "nuget.org still reachable"; exit 1; fi

      - name: Restore, build and test from the feed alone
        run: |
          tools/packages.sh restore
          dotnet build RedStarOS/RedStarOS.csproj -c Release --no-restore
          dotnet build tests/RedStarOS.Tests/RedStarOS.Tests.csproj -c Release --no-restore

      - name: The AppImage's self-contained build from the feed alone
        run: >
          dotnet publish RedStarOS/RedStarOS.csproj -c Release -r linux-x64 --self-contained true
          --source "$(tools/packages.sh where)" -p:NuGetAudit=false -p:REDSTAR_LOCKED=1 -o "$RUNNER_TEMP/publish"

  compositor:
    name: Wayland compositor (wlroots 0.20)
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 20
    steps:
      - name: wlroots 0.20 and build tools
        run: |
          pacman -Syu --noconfirm --needed git gcc meson ninja pkgconf wlroots0.20 wayland wayland-protocols \
            libxkbcommon libxcb xcb-util-wm cairo libdrm pixman xorg-xwayland libx11 ttf-dejavu

      - uses: actions/checkout@v5

      - name: redstar-comp compiles without warnings
        working-directory: compositor
        run: |
          meson setup build -Dwerror=true
          meson compile -C build
          ./build/redstar-comp --version | grep -qx "redstar-comp $(../tools/version.sh)"

      - name: Behaviour tests (headless, through Xwayland)
        run: compositor/test/run-tests.sh

  browser:
    name: Crimson Online (GTK 4 + WebKitGTK)
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      - name: WebKitGTK, GTK 4 and build tools (and wlroots for the compositor it runs in)
        run: |
          pacman -Syu --noconfirm --needed git gcc meson ninja pkgconf webkitgtk-6.0 gtk4 json-glib libsoup3 \
            wlroots0.20 wayland wayland-protocols libxkbcommon libxcb xcb-util-wm cairo libdrm pixman xorg-xwayland \
            mesa ttf-dejavu dbus gdb

      - uses: actions/checkout@v5

      - name: Builds
        run: |
          (cd compositor && meson setup build && meson compile -C build)
          (cd browser && meson setup build && meson compile -C build)

      - name: Unit tests (filters, address bar, bookmarks and history file)
        run: meson test -C browser/build --print-errorlogs

      - name: Self-test (the real browser, headless in redstar-comp)
        env:
          REDSTAR_SELFTEST_GDB: 1
        run: browser/test/run-selftest.sh

  login:
    name: Login screen (Vala + GTK 4)
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 20
    steps:
      - name: Vala, GTK 4 and build tools (and wlroots for the compositor it runs in)
        run: |
          pacman -Syu --noconfirm --needed git gcc meson ninja pkgconf vala gtk4 gtk3 json-glib \
            wlroots0.20 wayland wayland-protocols libxkbcommon libxcb xcb-util-wm cairo libdrm pixman xorg-xwayland \
            mesa ttf-dejavu

      - uses: actions/checkout@v5

      - name: Builds
        run: |
          (cd compositor && meson setup build && meson compile -C build)
          crimson-gtk/build.sh
          greeter/build.sh

      - name: Unit tests (the GTK theme's style sheet; greetd, signing in, people and desktops)
        run: |
          meson test -C crimson-gtk/build --print-errorlogs
          meson test -C greeter/build --print-errorlogs

      - name: The GTK theme folder, read by GTK 4 and GTK 3 themselves (inside redstar-comp, for a display)
        run: crimson-gtk/test/in-compositor.sh meson test -C crimson-gtk/build --print-errorlogs

      - name: The login screen drawn (headless, inside redstar-comp)
        run: |
          greeter/test/run-screenshot.sh login.png
          echo "---- screen.png (Login-crimson-login) ----"
          base64 -w 0 login.png; echo
          echo "---- end screen.png ----"

      - name: The GTK theme's gallery drawn, dark and light
        run: |
          crimson-gtk/test/headless.sh gallery-dark.png crimson-gtk/build/crimson-gtk-gallery
          crimson-gtk/test/headless.sh gallery-light.png crimson-gtk/build/crimson-gtk-gallery --light
          # and as any other program gets it: GTK's installed "Crimson Banner" theme, none of our own styling
          cp -r crimson-gtk/build/theme-for-tests /usr/share/themes/CrimsonBanner
          crimson-gtk/test/headless.sh gallery-other.png crimson-gtk/build/crimson-gtk-gallery --as-other-program
          crimson-gtk/test/headless.sh gallery-other-light.png crimson-gtk/build/crimson-gtk-gallery --as-other-program --light
          for f in gallery-dark gallery-light gallery-other gallery-other-light; do
            echo "---- screen.png (GTK-$f) ----"; base64 -w 0 $f.png; echo; echo "---- end screen.png ----"
          done

  arch-packages:
    name: Arch packages and our pacman repository
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 60
    env:
      # outside the build user's home (mode 700), so pacman, as root, can read it
      REDSTAR_REPO: /srv/crimson-banner
    steps:
      - name: Build tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git sudo dotnet-sdk dotnet-runtime dotnet-targeting-pack-8.0 dotnet-runtime-8.0 gnupg python
          useradd -m builder
          install -d -o builder /srv/crimson-banner
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the whole history and its tags: tools/version.sh counts from the last release

      - name: Fill our package feed (the only step that reaches nuget.org)
        run: |
          chown -R builder "$GITHUB_WORKSPACE"
          sudo -u builder -H env DOTNET_CLI_TELEMETRY_OPTOUT=1 tools/packages.sh fill

      - name: Cut off nuget.org
        run: |
          echo "0.0.0.0 api.nuget.org www.nuget.org nuget.org globalcdn.nuget.org" >> /etc/hosts
          if curl -fsS -m 10 https://api.nuget.org/v3/index.json >/dev/null 2>&1; then echo "nuget.org still reachable"; exit 1; fi

      - name: ./install-arch.sh (key, build, sign, pacman.conf, install, optional programs)
        run: sudo -u builder -H --preserve-env=REDSTAR_REPO ./install-arch.sh --yes --extras

      - name: The login screen's package and its switch
        run: |
          for f in /usr/bin/crimson-greeter /usr/bin/crimson-greeter-setup /usr/share/crimson-banner/greetd-config.toml \
                   /usr/lib/tmpfiles.d/crimson-greeter.conf; do test -e "$f" || { echo "missing: $f"; exit 1; }; done
          pacman -Q greetd greetd-agreety xorg-xinit
          getent passwd greeter
          # the login screen is installed; outside greetd it says how to look at it instead
          test -x /usr/bin/crimson-login
          set +e; env -u GREETD_SOCK crimson-login 2>/tmp/greeter.err; code=$?; set -e
          cat /tmp/greeter.err; [ "$code" = 2 ] && grep -q -- "crimson-login --demo" /tmp/greeter.err
          # switching to it and back, for real (systemctl enable/disable work without a running systemd)
          crimson-greeter-setup enable
          [ "$(crimson-greeter-setup status)" = "Crimson Banner OS's login screen (greetd)" ]
          grep -q crimson-greeter /etc/greetd/config.toml
          crimson-greeter-setup disable
          ! grep -q crimson-greeter /etc/greetd/config.toml
          [ "$(crimson-greeter-setup status)" != "Crimson Banner OS's login screen (greetd)" ]

      - name: Publishing an app (tools/publish-app.sh --local) and installing it from [crimson-banner-apps]
        run: |
          mkdir -p apps/ci-hello
          cat > apps/ci-hello/app.json <<'J'
          { "id": "ci-hello", "name": "CI Hello", "summary": "A test app", "license": "GPL-3.0-or-later", "categories": ["Utility"] }
          J
          cat > apps/ci-hello/PKGBUILD <<'P'
          pkgname=ci-hello
          pkgver=1.2.3
          pkgrel=1
          pkgdesc='A test app for Software'
          arch=(any)
          license=(GPL-3.0-or-later)
          package() { install -d "$pkgdir/usr/bin"; printf '#!/bin/sh\necho hello from ci-hello\n' > "$pkgdir/usr/bin/ci-hello"; chmod 755 "$pkgdir/usr/bin/ci-hello"; }
          P
          chown -R builder apps software
          sudo -u builder -H tools/publish-app.sh --local apps/ci-hello
          python3 -c "import json; d=json.load(open('/srv/crimson-banner-apps/catalog/catalog.json')); a=d['software'][0]; assert a['id']=='ci-hello' and a['version']=='1.2.3' and a['install']==[{'kind':'pacman','package':'ci-hello'}], a"
          mkdir -p /tmp/gpgv && gpgv --homedir /tmp/gpgv --keyring "$PWD/software/crimson-banner.gpg" /srv/crimson-banner-apps/catalog/catalog.json.sig /srv/crimson-banner-apps/catalog/catalog.json
          # what Software does for the first of our apps: crimson-apps-repo enable, refresh, install
          CRIMSON_APPS_SERVER="file:///srv/crimson-banner-apps/\$arch" CRIMSON_APPS_KEYRING="$PWD/software/crimson-banner.gpg" crimson-apps-repo enable
          [ "$(crimson-apps-repo status)" = enabled ]
          pacman -Sy --noconfirm ci-hello
          [ "$(ci-hello)" = "hello from ci-hello" ]
          pacman -Rns --noconfirm ci-hello
          # Planner, the first of our own apps: built from the tree (it shares the shell's styles), signed into the
          # same repository, listed in the catalogue, and installed as Software installs it
          sudo -u builder -H tools/publish-app.sh --local apps/planner
          python3 -c "import json; d=json.load(open('/srv/crimson-banner-apps/catalog/catalog.json')); import re; v=re.search(r'^pkgver=(.+)$', open('apps/planner/PKGBUILD').read(), re.M).group(1); a=[x for x in d['software'] if x['id']=='planner'][0]; assert a['version']==v and a['install']==[{'kind':'pacman','package':'crimson-planner'}] and a['license']=='GPL-3.0-or-later', a"
          pacman -Sy --noconfirm crimson-planner
          test -x /usr/bin/crimson-planner && test -f /usr/lib/crimson-planner/CrimsonPlanner.dll
          test -f /usr/share/applications/crimson-planner.desktop && test -f /usr/share/icons/hicolor/256x256/apps/crimson-planner.png
          pacman -Rns --noconfirm crimson-planner
          # People's Archive, the same way
          sudo -u builder -H tools/publish-app.sh --local apps/archive
          python3 -c "import json; d=json.load(open('/srv/crimson-banner-apps/catalog/catalog.json')); import re; v=re.search(r'^pkgver=(.+)$', open('apps/archive/PKGBUILD').read(), re.M).group(1); a=[x for x in d['software'] if x['id']=='archive'][0]; assert a['version']==v and a['install']==[{'kind':'pacman','package':'crimson-archive'}], a"
          pacman -Sy --noconfirm crimson-archive
          test -x /usr/bin/crimson-archive && test -f /usr/lib/crimson-archive/PeoplesArchive.dll && test -f /usr/share/applications/crimson-archive.desktop
          pacman -Rns --noconfirm crimson-archive
          # Atlas, the same way
          sudo -u builder -H tools/publish-app.sh --local apps/atlas
          python3 -c "import json; d=json.load(open('/srv/crimson-banner-apps/catalog/catalog.json')); import re; v=re.search(r'^pkgver=(.+)$', open('apps/atlas/PKGBUILD').read(), re.M).group(1); a=[x for x in d['software'] if x['id']=='atlas'][0]; assert a['version']==v and a['install']==[{'kind':'pacman','package':'crimson-atlas'}], a"
          pacman -Sy --noconfirm crimson-atlas
          test -x /usr/bin/crimson-atlas && test -f /usr/lib/crimson-atlas/CrimsonAtlas.dll && test -f /usr/share/applications/crimson-atlas.desktop
          pacman -Rns --noconfirm crimson-atlas
          crimson-apps-repo disable
          # leave the tree as it was (publishing writes the shell's copy of the catalogue and the key)
          sudo -u builder git checkout -- software/catalog.json software/crimson-banner.gpg
          rm -rf apps/ci-hello

      - name: Every signature in the repository
        run: sudo -u builder -H --preserve-env=REDSTAR_REPO tools/repo.sh check

      - name: Running it again (nothing to build) and with --rebuild (same version, built again)
        run: |
          sudo -u builder -H --preserve-env=REDSTAR_REPO ./install-arch.sh --yes | tee /tmp/again.log
          grep -q "is already built" /tmp/again.log
          sudo -u builder -H --preserve-env=REDSTAR_REPO ./install-arch.sh --yes --rebuild

      - name: What was installed is complete
        run: |
          pacman -Qi crimson-banner crimson-banner-shell redstar-comp redstar-wm crimson-online | grep -E '^(Name|Version)'
          for f in /usr/lib/crimson-banner/RedStarOS /usr/bin/RedStarOS /usr/bin/redstaros-session /usr/bin/redstar-comp \
                   /usr/bin/redstar-wm /usr/bin/redstar-online /usr/share/xsessions/redstaros.desktop \
                   /usr/share/wayland-sessions/redstaros-wayland.desktop /etc/pam.d/crimson-banner \
                   /usr/share/applications/org.redstaros.Online.desktop; do
            test -e "$f" || { echo "missing: $f"; exit 1; }
          done
          # the icon theme, its links followed: a drawn program and a picture of every size
          test -f /usr/share/icons/CrimsonBanner/index.theme && test -f /usr/share/icons/CrimsonBanner/names.txt
          # the GTK theme other programs use, and the tool that makes a person's own copy in their accent
          for f in index.theme gtk-4.0/gtk.css gtk-4.0/gtk-dark.css gtk-3.0/gtk.css gtk-3.0/gtk-dark.css; do
            test -s "/usr/share/themes/CrimsonBanner/$f" || { echo "GTK theme: missing $f"; exit 1; }
          done
          crimson-gtk-theme /tmp/own-theme '#0078D4' && grep -q "accent #0078D4" /tmp/own-theme/gtk-4.0/gtk-dark.css
          for f in scalable/apps/org.gnome.Nautilus.svg 32x32/apps/org.kde.konsole.png 128x128/apps/gedit.png; do
            test -L "/usr/share/icons/CrimsonBanner/$f" && test -s "/usr/share/icons/CrimsonBanner/$f" || { echo "icon theme: missing $f"; exit 1; }
          done
          grep -q '^Exec=/usr/bin/redstaros-session' /usr/share/xsessions/redstaros.desktop
          grep -q '/usr/lib/crimson-banner/RedStarOS' /usr/bin/redstaros-session
          # every program finds all of its libraries among the installed dependencies
          missing="$(for b in /usr/lib/crimson-banner/RedStarOS /usr/lib/crimson-banner/*.so /usr/bin/redstar-comp \
                       /usr/bin/redstar-wm /usr/bin/redstar-online; do ldd "$b" | sed "s#^#${b##*/}: #"; done | grep 'not found' || true)"
          if [ -n "$missing" ]; then echo "$missing"; exit 1; fi
          pacman -Qkk crimson-banner-shell redstar-comp redstar-wm crimson-online
          # every program reports the version the packages were built as (tools/version.sh)
          want="$(sudo -u builder -H tools/version.sh)"
          [ "$(pacman -Q crimson-banner | cut -d' ' -f2)" = "$(sudo -u builder -H tools/version.sh --pkgver)-1" ]
          redstar-comp --version | grep -qx "redstar-comp $want"
          redstar-wm --version | grep -qx "redstar-wm $want"
          redstar-online --version | grep -qx "redstar-online $want"
          echo "All report $want"

      - name: The update channel (tools/publish-os.sh --local) as an installed system sees it (crimson-repo enable os)
        run: |
          # the version, before publishing writes CI's own key over software/crimson-banner.gpg (restored below)
          want="$(sudo -u builder -H tools/version.sh --pkgver)-1"
          sudo -u builder -H env REDSTAR_OS_DIR=/srv/crimson-banner-os tools/publish-os.sh --local
          sudo -u builder -H env REDSTAR_REPO=/srv/crimson-banner-os tools/repo.sh check
          # a system installed from the ISO: no [crimson-banner] of its own (this one has ./install-arch.sh's, file://)
          cp /etc/pacman.conf /tmp/pacman.conf.mine
          [ "$(crimson-repo status os)" = local ]
          crimson-repo enable os | grep -q "left as it is"
          sed -i '/^\[crimson-banner\]/,/^\[/{/^\[crimson-banner\]/d;/^\[/!d}' /etc/pacman.conf
          CRIMSON_OS_SERVER="file:///srv/crimson-banner-os/\$arch" CRIMSON_KEYRING="$PWD/software/crimson-banner.gpg" crimson-repo enable os
          [ "$(crimson-repo status os)" = enabled ]
          pacman -Sy
          # every package of ours comes from it, at the version just published
          for p in crimson-banner crimson-banner-shell crimson-banner-greeter redstar-comp redstar-wm crimson-online; do
            pacman -Sl crimson-banner | grep -q "^crimson-banner $p " || { echo "not in the update repository: $p"; exit 1; }
          done
          got="$(pacman -Si crimson-banner/crimson-banner | sed -n 's/^Version *: //p')"
          [ "$got" = "$want" ] || { echo "the update repository has $got, not $want"; exit 1; }
          # the testing channel: the same repository from another server (here a copy, in its own folder)
          mkdir -p /srv/crimson-banner-os-testing && cp -a /srv/crimson-banner-os/x86_64 /srv/crimson-banner-os-testing/
          export CRIMSON_OS_TESTING_SERVER="file:///srv/crimson-banner-os-testing/\$arch"
          [ "$(crimson-repo channel)" = releases ]
          crimson-repo channel testing
          [ "$(crimson-repo channel)" = testing ]
          grep -qx "Server = file:///srv/crimson-banner-os-testing/\$arch" /etc/pacman.conf
          pacman -Sy
          pacman -Si crimson-banner/crimson-banner-shell >/dev/null
          crimson-repo channel releases
          [ "$(crimson-repo channel)" = releases ]
          crimson-repo disable os
          [ "$(crimson-repo status os)" = disabled ]
          cp /tmp/pacman.conf.mine /etc/pacman.conf
          sudo -u builder git checkout -- software/crimson-banner.gpg

      - name: ./install-arch.sh --uninstall
        run: |
          sudo -u builder -H --preserve-env=REDSTAR_REPO ./install-arch.sh --uninstall --yes
          ! pacman -Q crimson-banner 2>/dev/null
          ! grep -q '^\[crimson-banner\]' /etc/pacman.conf
          ! grep -q 'install-arch.sh' /etc/pacman.conf
          pacman -Sy >/dev/null   # pacman.conf is still valid
