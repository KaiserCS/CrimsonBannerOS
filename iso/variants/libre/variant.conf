# Crimson Banner OS with Linux-libre: nothing non-free on the ISO or installed from it. Some hardware won't work
# (most Wi-Fi chips and many graphics cards need non-free firmware); the Linux ISO is for those.
TITLE="Linux-libre"
ISO_NAME="crimson-banner-libre"
KERNEL="linux-libre"
PARAMS=""
BUILD="linux-libre"
SERVICES=""
# none of these may end up on this ISO (tools/iso.sh checks the package list)
NONFREE="linux-firmware linux-firmware-* amd-ucode intel-ucode sof-firmware broadcom-wl broadcom-wl-dkms"
