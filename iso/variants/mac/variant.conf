# Crimson Banner OS for Intel Macs: t2linux's kernel (keyboard, trackpad, audio, Touch Bar and fans on T2 Macs,
# 2018–2020) and Broadcom's wl driver for the Wi-Fi of older Macs. On T2 Macs the Wi-Fi and Bluetooth firmware is
# copied from the Mac's own macOS when the live session starts, never shipped. The firmware and wl are non-free
# (PRINCIPLES.md, "Installer images").
TITLE="Intel Mac"
ISO_NAME="crimson-banner-mac"
KERNEL="linux-t2"
# what t2linux recommends for T2 Macs (wiki.t2linux.org); harmless on older Macs
PARAMS="intel_iommu=on iommu=pt pcie_ports=compat"
BUILD="linux-t2 apple-bcm-firmware-fetcher apple-t2-audio-config t2fanrd tiny-dfr"
SERVICES="t2fanrd tiny-dfr"
