# Firmware the live session fetched at boot (on T2 Macs, from macOS) isn't in the root image: it is copied over.
---
dontChroot: true
timeout: 120
script:
    - command: "sh -c 'if [ -f /var/lib/apple-bcm-firmware-fetcher/installed-files ]; then mkdir -p ${ROOT}/usr/lib/firmware/brcm ${ROOT}/var/lib && cp -a /usr/lib/firmware/brcm/. ${ROOT}/usr/lib/firmware/brcm/ && cp -a /var/lib/apple-bcm-firmware-fetcher ${ROOT}/var/lib/; fi'"
      timeout: 120
