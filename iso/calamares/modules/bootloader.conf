# GRUB, on BIOS and UEFI; Macs and machines with fussy firmware also get the fallback EFI\BOOT\BOOTX64.EFI.
---
efiBootLoader: "grub"
kernelSearchPath: "/boot"
kernelPattern: "^vmlinuz.*"
kernelParams: [ "quiet"@KERNEL_PARAMS@ ]
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
efiBootloaderId: "crimson-banner"
installEFIFallback: true
installHybridGRUB: false
