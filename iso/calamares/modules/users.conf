# The person's account: in wheel (sudo), and the groups the desktop's devices need. The live user is gone by then.
---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - lp
    - video
    - network
    - storage
    - name: wheel
      must_exist: false
      system: true
    - audio
sudoersGroup:    wheel
sudoersConfigureWithGroup: true
setRootPassword: true
doReusePassword: true
doAutologin:     false
allowWeakPasswords: true
allowWeakPasswordsDefault: false
passwordRequirements:
    minLength: 1
user:
  shell: /bin/bash
  forbidden_names: [ root, liveuser ]
  home_permissions: "o700"
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "crimson-${cpu}"
  forbidden_names: [ localhost ]
presets:
    fullName:
        editable: true
    loginName:
        editable: true
