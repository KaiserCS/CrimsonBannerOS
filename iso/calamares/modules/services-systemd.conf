# Started on the installed system (the login screen itself is set up by crimson-live-cleanup). tools/iso.sh adds
# each ISO's own services (@SERVICES@).
---
units:
    - name: NetworkManager
      action: enable
      mandatory: true
    - name: bluetooth
      action: enable
    - name: cups
      action: enable
    - name: systemd-timesyncd
      action: enable
    - name: power-profiles-daemon
      action: enable
    - name: fstrim.timer
      action: enable
@SERVICE_UNITS@
