# /etc/default/grub on the installed system. tools/iso.sh adds each ISO's own kernel parameters (variant.conf, PARAMS).
---
overwrite: false
prefer_grub_d: false
keep_distributor: false
kernel_params: [ "quiet"@KERNEL_PARAMS@ ]
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "saved"
    GRUB_DISABLE_SUBMENU: true
    GRUB_TERMINAL_OUTPUT: "console"
    GRUB_DISABLE_RECOVERY: true
    GRUB_DISABLE_OS_PROBER: false
    GRUB_DISTRIBUTOR: "Crimson Banner OS"
always_use_defaults: false
