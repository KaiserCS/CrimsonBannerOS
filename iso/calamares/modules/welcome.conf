# The first page: what this computer needs. No network check and no GeoIP lookup (nothing is sent anywhere).
---
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    true
showDonateUrl:          false
requirements:
    requiredStorage:    20
    requiredRam:        2.0
    check:
        - storage
        - ram
        - power
        - root
        - screen
    required:
        - storage
        - ram
        - root
geoip:
    style:    "none"
