# SPDX-License-Identifier: GPL-3.0-or-later
# Calamares, as Crimson Banner OS's installer. It copies the live system to disk as it is (unpackfs), so installing
# needs no network; then it makes the copy an ordinary installed system (crimson-live-cleanup, removeuser,
# packages). tools/iso.sh fills in @KERNEL@ for each ISO.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id: cleanup
    module: shellprocess
    config: shellprocess-cleanup.conf
  - id: copyfirmware
    module: shellprocess
    config: shellprocess-copyfirmware.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - shellprocess@copyfirmware
      - shellprocess@cleanup
      - removeuser
      - users
      - networkcfg
      - hwclock
      - services-systemd
      - packages
      - initcpiocfg
      - initcpio
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished

branding: crimson
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
