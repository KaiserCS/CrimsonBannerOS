# The live system's initramfs (archiso): finds the ISO, also when it is booted from a file on another disk
# (archiso_loop_mnt). No network boot. The installer deletes this file, so the installed system gets the usual one.
# No kms hook: it copied every graphics card's firmware in (about 140 MiB, NVIDIA's alone 105), on the ISO besides
# the live system's own. The graphics driver loads from the live system instead, a few seconds later.
HOOKS=(base udev microcode modconf archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
