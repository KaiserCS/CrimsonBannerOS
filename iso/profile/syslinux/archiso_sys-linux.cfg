LABEL crimson
TEXT HELP
Start Crimson Banner OS from this medium. Nothing on the computer changes until you choose
"Install Crimson Banner OS" on its desktop.
ENDTEXT
MENU LABEL Crimson Banner OS (@VARIANT_TITLE@, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-@KERNEL@
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-@KERNEL@.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=50% @PARAMS@ %KERNEL_PARAMS%

LABEL crimsonsafe
TEXT HELP
For graphics that don't start: the basic display driver, no hardware acceleration.
ENDTEXT
MENU LABEL Crimson Banner OS, safe graphics (BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-@KERNEL@
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-@KERNEL@.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=50% @PARAMS@ nomodeset %KERNEL_PARAMS%
