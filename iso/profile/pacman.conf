# Used to build the ISO (archiso's pacman.conf): Arch's repositories, and Crimson Banner OS's own packages from the
# local repository tools/iso.sh made (@REPO@). The installed system gets Arch's usual /etc/pacman.conf.
[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[crimson-banner]
SigLevel = @REPO_SIGLEVEL@
Server = file://@REPO@

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
