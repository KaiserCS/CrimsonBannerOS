<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Red Star Online</title>
  <style>
    /* Same tokens as the shell (Styles/Shell.axaml); renderer.js swaps them for light mode / accent. */
    :root {
      --accent: #0078D4; --bg: #202020; --panel: #2B2B2B; --field: #1C1C1C; --hover: rgba(255,255,255,.10);
      --text: #FFFFFF; --muted: #A0A0A0; --border: #3A3A3A; --danger-bg: #442726; --danger: #FF99A4;
    }
    :root[data-theme="light"] {
      --bg: #F3F3F3; --panel: #FFFFFF; --field: #FFFFFF; --hover: rgba(0,0,0,.06);
      --text: #1A1A1A; --muted: #5F5F5F; --border: #E0E0E0; --danger-bg: #FDE7E9; --danger: #A80000;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: system-ui, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; flex-direction: column; }
    #bar { display: flex; align-items: center; gap: 4px; padding: 8px 10px; background: var(--panel);
      border-bottom: 1px solid var(--border); }
    #bar button { width: 32px; height: 32px; padding: 0; display: grid; place-items: center; background: transparent;
      color: var(--text); border: 0; border-radius: 8px; font-size: 15px; cursor: pointer; }
    #bar button:disabled { opacity: .35; cursor: default; }
    #bar button:not(:disabled):hover { background: var(--hover); }
    #url { flex: 1; height: 34px; margin: 0 6px; background: var(--field); color: var(--text);
      border: 1px solid var(--border); border-radius: 17px; padding: 0 16px; font-size: 14px; outline: none; }
    #url:focus { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
    #brand { color: var(--accent); font-size: 18px; margin: 0 8px 0 2px; user-select: none; }
    #progress { height: 2px; background: transparent; overflow: hidden; }
    #progress::after { content: ""; display: block; height: 100%; width: 0; background: var(--accent); }
    body.loading #progress::after { width: 40%; animation: slide 1s ease-in-out infinite; }
    @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
    #error { display: none; padding: 8px 14px; background: var(--danger-bg); color: var(--danger); font-size: 13px; }
    webview { flex: 1; background: #fff; }
  </style>
</head>
<body>
  <div id="bar">
    <button id="back" title="Back (Alt+Left)">&#9664;</button>
    <button id="forward" title="Forward (Alt+Right)">&#9654;</button>
    <button id="reload" title="Reload (F5)">&#10227;</button>
    <button id="home" title="Home">&#127968;</button>
    <input id="url" type="text" spellcheck="false" placeholder="Search or enter address (Ctrl+L)">
    <span id="brand" title="Red Star Online">&#9733;</span>
  </div>
  <div id="progress"></div>
  <div id="error"></div>
  <webview id="view" src="about:blank" allowpopups></webview>
  <script src="renderer.js"></script>
</body>
</html>
