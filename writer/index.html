<!doctype html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Red Star Writer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <div id="tabs"></div>
  <button id="newTab" class="flat" title="New document (Ctrl+N)">＋</button>
</header>

<nav id="ribbon">
  <div class="grp">
    <button data-cmd="new" title="New (Ctrl+N)">🗋 New</button>
    <button data-cmd="open" title="Open (Ctrl+O)">📂 Open</button>
    <button data-cmd="save" title="Save (Ctrl+S)">💾 Save</button>
    <button data-cmd="saveas" title="Save As (Ctrl+Shift+S)">Save As</button>
  </div>
  <div class="grp">
    <button data-cmd="pdf" title="Export as PDF">PDF</button>
    <button data-cmd="print" title="Print (Ctrl+P)">🖨</button>
  </div>
  <div class="grp">
    <button data-ex="undo" title="Undo (Ctrl+Z)">↶</button>
    <button data-ex="redo" title="Redo (Ctrl+Y)">↷</button>
  </div>
  <div class="grp">
    <select id="style" title="Paragraph style">
      <option value="p">Normal</option><option value="h1">Heading 1</option><option value="h2">Heading 2</option>
      <option value="h3">Heading 3</option><option value="blockquote">Quote</option><option value="pre">Code</option>
    </select>
    <select id="font" title="Font">
      <option>Arial</option><option>Calibri</option><option>Cambria</option><option>Georgia</option><option>Times New Roman</option>
      <option>Verdana</option><option>Trebuchet MS</option><option>Courier New</option><option>DejaVu Sans</option><option>DejaVu Serif</option><option>Liberation Sans</option>
    </select>
    <select id="size" title="Font size (pt)">
      <option>8</option><option>9</option><option>10</option><option selected>11</option><option>12</option><option>14</option>
      <option>16</option><option>18</option><option>20</option><option>24</option><option>28</option><option>36</option><option>48</option><option>72</option>
    </select>
  </div>
  <div class="grp">
    <button data-ex="bold" title="Bold (Ctrl+B)"><b>B</b></button>
    <button data-ex="italic" title="Italic (Ctrl+I)"><i>I</i></button>
    <button data-ex="underline" title="Underline (Ctrl+U)"><u>U</u></button>
    <button data-ex="strikeThrough" title="Strikethrough"><s>S</s></button>
    <button data-ex="superscript" title="Superscript">x²</button>
    <button data-ex="subscript" title="Subscript">x₂</button>
    <label class="color" title="Text colour">A<input type="color" id="fore" value="#000000"></label>
    <label class="color hl" title="Highlight">▮<input type="color" id="back" value="#ffff00"></label>
    <button data-ex="removeFormat" title="Clear formatting">⌫</button>
  </div>
  <div class="grp">
    <button data-ex="justifyLeft" title="Align left">⯇</button>
    <button data-ex="justifyCenter" title="Centre">≡</button>
    <button data-ex="justifyRight" title="Align right">⯈</button>
    <button data-ex="justifyFull" title="Justify">☰</button>
    <button data-ex="insertUnorderedList" title="Bullets">• ≡</button>
    <button data-ex="insertOrderedList" title="Numbering">1. ≡</button>
    <button data-ex="outdent" title="Decrease indent">⇤</button>
    <button data-ex="indent" title="Increase indent">⇥</button>
    <select id="spacing" title="Line spacing">
      <option value="">Spacing</option><option>1</option><option>1.15</option><option>1.5</option><option>2</option>
    </select>
  </div>
  <div class="grp">
    <button data-cmd="link" title="Insert link (Ctrl+K)">🔗</button>
    <button data-cmd="image" title="Insert picture">🖼</button>
    <button data-cmd="table" title="Insert table">▦</button>
    <button data-cmd="hr" title="Horizontal line">―</button>
    <button data-cmd="pagebreak" title="Page break">⤓</button>
  </div>
  <div class="grp">
    <button data-cmd="find" title="Find and replace (Ctrl+F)">🔍</button>
    <button data-cmd="view" id="viewBtn" title="Toggle page view">📄</button>
    <select id="paper" title="Paper size"><option>A4</option><option>Letter</option></select>
  </div>
</nav>

<div id="findbar" hidden>
  <input id="findIn" placeholder="Find"><input id="replIn" placeholder="Replace with">
  <button id="findPrev" class="flat">↑</button><button id="findNext" class="flat">↓</button>
  <button id="replOne" class="flat">Replace</button><button id="replAll" class="flat">All</button>
  <label><input type="checkbox" id="findCase"> Aa</label>
  <span id="findCount"></span><button id="findClose" class="flat">✕</button>
</div>

<main id="scroller"><div id="sheet"><div id="paperwrap"><div id="editor" contenteditable="true" spellcheck="true"></div></div></div></main>

<footer id="status">
  <span id="words"></span><span id="chars"></span><span id="saved"></span><span class="grow"></span>
  <label class="chk"><input type="checkbox" id="pageNums" checked> Page numbers</label>
  <button class="flat" id="zoomOut">−</button><input type="range" id="zoom" min="50" max="250" value="100"><button class="flat" id="zoomIn">＋</button><span id="zoomLbl">100%</span>
</footer>
<input type="file" id="imgPick" accept="image/*" hidden>
<div id="toast" hidden></div>
<style id="pageStyle"></style>
<script src="docx.js"></script>
<script src="renderer.js"></script>
</body>
</html>
