<?xml version="1.0" encoding="UTF-8"?>
<!-- SPDX-License-Identifier: GPL-3.0-or-later
     "Folds": the banner's cloth up close, crimson folds sweeping across the dark. branding/README.md -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18181B"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5C0714"/>
      <stop offset="0.45" stop-color="#D21A33"/>
      <stop offset="1" stop-color="#3A040C"/>
    </linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2A0208"/>
      <stop offset="0.6" stop-color="#9E0C22"/>
      <stop offset="1" stop-color="#1A0105"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFD6DB" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="b20"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="b60"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="b120" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="120"/></filter>
  </defs>
  <rect width="3840" height="2160" fill="url(#room)"/>
  <!-- deep folds behind -->
  <path d="M -200,1500 C 700,1100 1400,1900 2300,1350 C 3000,900 3500,1300 4100,1000 L 4100,2400 L -200,2400 Z" fill="url(#c2)" opacity="0.85"/>
  <!-- the main sweep of cloth -->
  <path d="M -200,1250 C 600,800 1300,1550 2200,1050 C 2900,650 3400,900 4100,620 L 4100,1150 C 3400,1450 2900,1150 2250,1500 C 1350,2000 650,1300 -200,1750 Z" fill="url(#c1)"/>
  <!-- its light catching the top of each fold -->
  <path d="M -200,1250 C 600,800 1300,1550 2200,1050 C 2900,650 3400,900 4100,620 L 4100,700 C 3400,980 2900,740 2210,1130 C 1320,1630 610,890 -200,1330 Z" fill="url(#sheen)" filter="url(#b20)"/>
  <!-- the shade under it -->
  <path d="M -200,1750 C 650,1300 1350,2000 2250,1500 C 2900,1150 3400,1450 4100,1150 L 4100,1300 C 3400,1600 2900,1300 2260,1650 C 1360,2150 660,1450 -200,1900 Z" fill="#000000" opacity="0.55" filter="url(#b60)"/>
  <!-- a second, thinner fold above -->
  <path d="M -200,900 C 800,600 1500,1100 2400,760 C 3000,540 3500,700 4100,480 L 4100,600 C 3500,820 3000,680 2410,880 C 1500,1220 800,740 -200,1040 Z" fill="url(#c1)" opacity="0.55" filter="url(#b20)"/>
  <!-- a warm haze where the light falls -->
  <ellipse cx="2300" cy="1100" rx="1300" ry="600" fill="#C4141C" opacity="0.10" filter="url(#b120)"/>
</svg>
